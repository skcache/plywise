services:
  api:
    build:
      context: .
    image: ${PCT_API_IMAGE:-plywise-api:local}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 20s
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - plywise-data:/var/lib/plywise
    ports:
      - "${PCT_PUBLISH_BIND:-127.0.0.1}:${PCT_PUBLISH_PORT:-8787}:8787"
    environment:
      PCT_BIND_ADDRESS: ${PCT_BIND_ADDRESS:-0.0.0.0}
      PCT_REQUIRE_AUTH: ${PCT_REQUIRE_AUTH:-true}
      PCT_POSTGRES_URL: ${PCT_POSTGRES_URL:-}
      PCT_SUPABASE_URL: ${PCT_SUPABASE_URL:-}
      PCT_OIDC_ISSUER: ${PCT_OIDC_ISSUER:-}
      PCT_OIDC_JWKS_URL: ${PCT_OIDC_JWKS_URL:-}
      PCT_OIDC_AUDIENCE: ${PCT_OIDC_AUDIENCE:-authenticated}
      PCT_OIDC_PROVIDER: ${PCT_OIDC_PROVIDER:-supabase}
      PCT_TRUSTED_HOSTS: ${PCT_TRUSTED_HOSTS:-}
      PCT_ALLOWED_ORIGINS: ${PCT_ALLOWED_ORIGINS:-}

volumes:
  plywise-data:
