name: Release qualification

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0
      - run: chmod +x packaging/macos/package.sh packaging/macos/launcher packaging/macos/pct-data scripts/clean-install-smoke.sh
      - run: scripts/clean-install-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Personal-Chess-Tutor-macOS
          path: dist/Personal-Chess-Tutor-macOS.zip
          if-no-files-found: error

  container-image:
    needs: macos-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
      - run: chmod +x scripts/container-smoke.sh
      - run: scripts/container-smoke.sh
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Build and publish the API image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -eu
          IMAGE="ghcr.io/${IMAGE_OWNER,,}/plywise-api"
          SHORT_SHA="${RELEASE_SHA:0:12}"
          SAFE_TAG="${RELEASE_TAG//\//-}"
          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE:$SAFE_TAG" \
            --tag "$IMAGE:sha-$SHORT_SHA" \
            --tag "$IMAGE:latest" \
            --provenance=true \
            --sbom=true \
            --push \
            .
