services:
  api:
    # Keep the API on the private Compose network. The base file's loopback port
    # remains useful for local diagnostics, but public traffic should arrive at
    # the TLS edge below.
    environment:
      PCT_BIND_ADDRESS: 0.0.0.0
      PCT_REQUIRE_AUTH: "true"
    restart: unless-stopped

  edge:
    image: caddy:2.9.1-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${PCT_HTTP_PORT:-80}:80"
      - "${PCT_HTTPS_PORT:-443}:443"
    environment:
      PCT_API_DOMAIN: ${PCT_API_DOMAIN:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
